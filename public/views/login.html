<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masuk Ujian Siswa - CBT AL-FATIH</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-container {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 30px 24px 24px;
      text-align: center;
    }
    .brand-logo-circle {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 12px;
      backdrop-filter: blur(4px);
    }
    .login-body {
      padding: 28px 24px;
    }
    .form-control {
      font-size: 16px; /* Prevents auto-zoom on iOS */
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-logo-circle">🎓</div>
      <h1 style="font-size: 22px; font-weight: 800; color: white; letter-spacing: 0.02em;">CBT AL-FATIH</h1>
      <p style="font-size: 13px; opacity: 0.9; margin-top: 4px;">Aplikasi Ujian Berbasis Komputer & Handphone</p>
    </div>

    <div class="login-body">
      <!-- Student Login Form -->
      <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
        <div class="form-group">
          <label class="form-label">Nomor Induk Siswa (NIS) / Username</label>
          <input type="text" id="studentNis" class="form-control" placeholder="Masukkan NIS sesuai kartu ujian" required autofocus inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="form-label">Password Ujian</label>
          <input type="password" id="studentPassword" class="form-control" placeholder="Masukkan password kartu ujian" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; padding: 13px; font-size: 16px; font-weight: 700; margin-top: 10px; border-radius: 10px;">
          Masuk ke Ruang Ujian →
        </button>
      </form>

      <!-- Discreet Admin Link -->
      <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px;">
        <a href="/admin/login" style="color: var(--text-muted); text-decoration: none;">
          🔐 Masuk sebagai Pengawas / Proktor
        </a>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    async function handleStudentLogin(e) {
      e.preventDefault();
      const nis = document.getElementById('studentNis').value.trim();
      const password = document.getElementById('studentPassword').value.trim();
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const res = await fetch('/api/auth/student/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nis, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/student/confirm';
        } else {
          showToast(data.message || 'NIS atau password salah!', 'danger');
          btn.disabled = false;
          btn.textContent = 'Masuk ke Ruang Ujian →';
        }
      } catch (err) {
        showToast('Gagal menghubungi server', 'danger');
        btn.disabled = false;
        btn.textContent = 'Masuk ke Ruang Ujian →';
      }
    }
  </script>
</body>
</html>
