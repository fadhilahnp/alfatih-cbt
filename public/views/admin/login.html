<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Proktor / Admin - CBT AL-FATIH</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-container {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 28px 24px;
      text-align: center;
      border-bottom: 3px solid #3b82f6;
    }
    .brand-logo-circle {
      width: 58px;
      height: 58px;
      background: #3b82f6;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 10px;
    }
    .login-body {
      padding: 28px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-logo-circle">🔑</div>
      <h1 style="font-size: 20px; font-weight: 800; color: white;">PANEL PROKTOR & ADMIN</h1>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Sistem Pengawasan CBT Al-Fatih</p>
    </div>

    <div class="login-body">
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label class="form-label">Username Admin / Proktor</label>
          <input type="text" id="adminUsername" class="form-control" placeholder="Masukkan username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 6px;">
          Masuk ke Dashboard Admin →
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px;">
        <a href="/" style="color: var(--text-muted); text-decoration: none;">← Kembali ke Halaman Siswa</a>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const username = document.getElementById('adminUsername').value;
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          showToast(data.message || 'Login admin gagal', 'danger');
        }
      } catch (err) {
        showToast('Kesalahan koneksi ke server', 'danger');
      }
    }
  </script>
</body>
</html>
