<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Ujian Siswa - CBT AL-FATIH</title>
  <link rel="stylesheet" href="/css/print-card.css">
  <style>
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .form-select {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }
  </style>
</head>
<body class="print-body">

  <!-- Controls Bar (Hidden during printing) -->
  <div class="print-controls-bar no-print">
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="/admin/students" class="btn btn-secondary">← Kembali ke Data Siswa</a>
      <div style="display: flex; align-items: center; gap: 8px;">
        <label style="font-size: 13px; font-weight: 600;">Filter Kelas:</label>
        <select id="classSelect" class="form-select" onchange="loadCards()">
          <option value="ALL">Semua Kelas</option>
        </select>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span id="cardCountInfo" style="font-size: 13px; font-weight: 600; color: #475569;">Memuat kartu...</span>
      <button class="btn btn-primary" onclick="window.print()">
        🖨️ Cetak Kartu Sekarang (Print)
      </button>
    </div>
  </div>

  <!-- Cards Container -->
  <div class="cards-grid" id="cardsGrid">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #64748b;">
      Memuat kartu peserta ujian...
    </div>
  </div>

  <script>
    async function loadClasses() {
      try {
        const res = await fetch('/api/admin/classes');
        const json = await res.json();
        const sel = document.getElementById('classSelect');
        json.data.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          sel.appendChild(opt);
        });
      } catch (e) {}
    }

    async function loadCards() {
      const cls = document.getElementById('classSelect').value;
      const container = document.getElementById('cardsGrid');
      const countInfo = document.getElementById('cardCountInfo');

      try {
        const res = await fetch(`/api/admin/students/cards?class_name=${cls}`);
        const json = await res.json();
        const students = json.data;
        const school = json.schoolInfo;

        countInfo.textContent = `Total: ${students.length} Kartu Siswa`;
        container.innerHTML = '';

        if (students.length === 0) {
          container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px;">Tidak ada siswa pada filter ini.</div>';
          return;
        }

        students.forEach(s => {
          const card = document.createElement('div');
          card.className = 'exam-card-item';

          card.innerHTML = `
            <!-- Kop Kartu -->
            <div class="card-header-kop">
              <div class="school-logo-box">AF</div>
              <div class="kop-text">
                <div class="kop-title">${school.name}</div>
                <div class="kop-sub">${school.title}</div>
                <div class="kop-year">${school.academicYear}</div>
              </div>
            </div>

            <!-- Isi Data Peserta -->
            <div class="card-body-content">
              <div class="photo-placeholder-box">
                <span style="font-size: 20px; margin-bottom: 2px;">👤</span>
                <span>FOTO</span>
                <span>3 x 4</span>
              </div>
              <table class="student-data-table">
                <tr>
                  <td class="label-col">No. Peserta / NIS</td>
                  <td class="colon-col">:</td>
                  <td class="value-col"><span class="credential-badge">${s.nis}</span></td>
                </tr>
                <tr>
                  <td class="label-col">Nama Peserta</td>
                  <td class="colon-col">:</td>
                  <td class="value-col">${s.name}</td>
                </tr>
                <tr>
                  <td class="label-col">Kelas / Rombel</td>
                  <td class="colon-col">:</td>
                  <td class="value-col">${s.class_name}</td>
                </tr>
                <tr>
                  <td class="label-col">Sesi / Ruang</td>
                  <td class="colon-col">:</td>
                  <td class="value-col">${s.session_name} / ${s.room_name}</td>
                </tr>
                <tr>
                  <td class="label-col">Password Login</td>
                  <td class="colon-col">:</td>
                  <td class="value-col"><span class="credential-badge">${s.password}</span></td>
                </tr>
              </table>
            </div>

            <!-- Footer Tanda Tangan & Barcode -->
            <div class="card-footer-sign">
              <div class="barcode-mockup">
                <div class="barcode-lines"></div>
                <div class="barcode-text">*${s.nis}*</div>
              </div>
              <div class="sign-box">
                <div>Jakarta, Panitia Ujian CBT</div>
                <div class="sign-space"></div>
                <div class="sign-name">Ketua Panitia CBT</div>
                <div>NIP. 19850712 201101 1 004</div>
              </div>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: red;">Gagal memuat kartu ujian.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadClasses();
      await loadCards();
    });
  </script>
</body>
</html>
